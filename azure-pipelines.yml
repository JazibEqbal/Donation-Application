trigger:
  - master

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'
  imageName: 'donation-platform'

stages:

  - stage: Setup
    displayName: 'Setup'
    jobs:
      - job: SetupPython
        displayName: 'Set up Python environment'
        steps:

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: 'Set up Python'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install dependencies'

  - stage: Test
    displayName: 'Run Tests'
    dependsOn: Setup
    jobs:
      - job: RunTests
        displayName: 'Run Python tests'
        steps:

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: 'Set up Python'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install dependencies'

          - script: |
              pytest --junitxml=test-results.xml
            displayName: 'Run tests'

          - task: PublishTestResults@2 # when you want Azure DevOps to understand and display test results.
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results.xml'
              failTaskOnFailedTests: true
            displayName: 'Publish test results'

          - task: PublishPipelineArtifact@1 # when you simply want to store files
            inputs:
              targetPath: 'test-results.xml'
              artifact: 'test-results'
            displayName: 'Publish test report'

  - stage: Docker
    displayName: 'Build and Push Docker Image'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: BuildAndPush
        displayName: 'Build and push Docker image'
        steps:

          #  - script: |
          #      docker build -t $(imageName):$(Build.BuildId) .
          #    displayName: 'Build Docker image'

          - task: Docker@2
            displayName: 'Build and push Docker image'
            inputs:
              command: buildAndPush
              repository: $(imageName)
              dockerfile: '**/Dockerfile'
              containerRegistry: 'YOUR-SERVICE-CONNECTION'
              tags: |
                $(Build.BuildId)

  - stage: Secrets
    displayName: 'Secrets'
    dependsOn: Docker
    condition: succeeded()
    jobs:
      - job: UseSecrets
        displayName: 'Use application secrets'
        steps:

          - script: |
              echo "Secrets"
            env:
              DATABASE_URL: $(DATABASE_URL)
              JWT_SECRET: $(JWT_SECRET)
